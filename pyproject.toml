[project]
name = "later-chat"
version = "0.1.0"
description = "An independent AI collaboration Chat product powered by MAF and AG-UI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-ag-ui==1.0.0rc8",
  "agent-framework-openai==1.10.1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "greenlet>=3.2,<4",
  "opentelemetry-sdk>=1.44,<2",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.41,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5,<6",
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["backend/tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
  ".venv",
  "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pyright]
include = ["backend/app"]
exclude = [".venv", "frontend"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.coverage.run]
branch = true
source = ["backend.app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
