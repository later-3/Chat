# Chat mobile/web entrypoint.
#
# This file is included inside the existing port-80 server block. Basic Auth
# is an HTTP-stage edge gate only; it is not a Product Principal or an
# Authentication Session. Provider credentials and Product state stay on the
# local Mac.

location ^~ /chat-pwa-http-test/ {
    return 308 /chat/;
}

location = /chat {
    auth_basic "Chat private workspace";
    auth_basic_user_file /etc/nginx/chat.htpasswd;
    return 308 /chat/;
}

location ^~ /chat/ {
    auth_basic "Chat private workspace";
    auth_basic_user_file /etc/nginx/chat.htpasswd;

    alias /opt/chat/current/web/;
    try_files $uri $uri/ /chat/index.html;
}

location ^~ /chat-api/ {
    auth_basic "Chat private workspace";
    auth_basic_user_file /etc/nginx/chat.htpasswd;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1260s;
    proxy_send_timeout 1260s;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The edge password must never become a backend Authorization credential.
    proxy_set_header Authorization "";
    add_header X-Accel-Buffering "no" always;

    proxy_pass http://127.0.0.1:4620/;
}
