# Chat云端同源网关。Cloudflare把chat.ai4child.asia转到33052，
# Nginx再通过33051上的SSH反向Relay访问Mac的Chat生产进程。

map $http_upgrade $chat_connection_upgrade {
    default upgrade;
    "" "";
}

upstream chat_gateway {
    server 127.0.0.1:33051 max_fails=1 fail_timeout=3s;
}

server {
    listen 127.0.0.1:33052;
    server_name chat.ai4child.asia;

    client_max_body_size 20m;

    location / {
        proxy_pass http://chat_gateway;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chat_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
    }

    error_page 502 503 504 = @chat_offline;
    location @chat_offline {
        default_type application/json;
        return 503 '{"type":"about:blank","title":"Chat gateway unreachable","status":503,"code":"chat_gateway_offline","retryable":true}';
    }
}
