# Chat 云端同源网关 — Nginx server block（拓扑A）
#
# 安装在云服务器 /etc/nginx/sites-available/chat.conf 并 symlink 到 sites-enabled。
# 只监听 127.0.0.1:33052；Cloudflare Tunnel（cloudflared）把
# chat.ai4child.asia 转发到这里。绝不直接监听公网接口。
#
# 认证由 Chat 网关自有登录页 + 签名 HttpOnly Cookie 承担；不得改用 auth_basic
# （浏览器原生认证框在已安装 iOS PWA 中没有可恢复登录面，pi-web 已验证）。
# 上游是 Mac 反向隧道 127.0.0.1:33051 → mac-main:43110；产品数据、Provider
# 凭据与会话密钥只留在 Mac，云端不持久化任何 Chat 数据。

# DSH 使用 WebSocket；连接头映射必须是 http 上下文（sites-enabled 包含点满足）。
map $http_upgrade $chat_connection_upgrade {
    default upgrade;
    "" "";
}

upstream chat_gateway {
    server 127.0.0.1:33051 max_fails=1 fail_timeout=3s;
}

server {
    listen 127.0.0.1:33052;
    server_name chat.ai4child.asia;

    client_max_body_size 20m;

    location / {
        proxy_pass http://chat_gateway;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        # DSH 实时流与 Workbench 预留 WebSocket 升级。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chat_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # 认证在应用层；任何外部 Authorization 头都不透传。
        proxy_set_header Authorization "";
    }

    # Mac 离线或隧道断开时返回明确 503，绝不把错误伪装成外壳。
    error_page 502 503 504 = @chat_offline;
    location @chat_offline {
        default_type application/json;
        return 503 '{"type":"about:blank","title":"Chat gateway unreachable","status":503,"code":"chat_gateway_offline","retryable":true}';
    }
}
