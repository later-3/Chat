<!doctype html>
<html lang="zh-CN" data-theme="thread">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Chat UI Lab · Project + Today</title>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const saved = localStorage.getItem("chat-ui-lab-theme");
        const theme = params.get("theme") || saved || "thread";
        document.documentElement.dataset.theme = ["thread", "paper", "graphite"].includes(theme)
          ? theme
          : "thread";
      })();
    </script>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/themes.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
