<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basecamp Home QA</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
      }
      figure {
        margin: 0;
        position: relative;
        background: #fff;
      }
      figcaption {
        position: absolute;
        z-index: 1;
        top: 10px;
        left: 10px;
        padding: 6px 9px;
        border-radius: 6px;
        background: rgb(0 0 0 / 72%);
        color: white;
        font-size: 16px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source · normalized 1707×960</figcaption>
        <img src="source-basecamp-home-normalized.png" alt="Source Basecamp Home" />
      </figure>
      <figure>
        <figcaption>Implementation final</figcaption>
        <img src="implementation-home-final-v2.png" alt="Implementation Home" />
      </figure>
    </main>
  </body>
</html>
