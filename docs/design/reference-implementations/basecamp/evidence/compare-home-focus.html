<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basecamp Home Focus QA</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #111;
        font-family: system-ui, sans-serif;
      }
      main {
        display: flex;
        gap: 18px;
        padding: 18px;
      }
      figure {
        width: 650px;
        height: 820px;
        margin: 0;
        overflow: hidden;
        position: relative;
        background: #fff;
      }
      figcaption {
        position: absolute;
        z-index: 2;
        top: 10px;
        left: 10px;
        padding: 6px 9px;
        border-radius: 6px;
        background: rgb(0 0 0 / 72%);
        color: white;
      }
      img {
        position: absolute;
        width: 1707px;
        max-width: none;
        left: -530px;
        top: -70px;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source · central board</figcaption>
        <img src="source-basecamp-home-normalized.png" alt="Source central board" />
      </figure>
      <figure>
        <figcaption>Implementation · central board</figcaption>
        <img src="implementation-home-final-v2.png" alt="Implementation central board" />
      </figure>
    </main>
  </body>
</html>
