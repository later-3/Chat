<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heptabase focused panel comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #171717; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 100vh; padding: 12px; }
      figure { display: flex; min-width: 0; flex-direction: column; gap: 8px; margin: 0; }
      figcaption { font-size: 13px; font-weight: 600; }
      .crop { height: 820px; overflow: hidden; border: 1px solid rgba(255,255,255,.16); background: white; }
      img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: right top; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source focus · Card content beside Whiteboard</figcaption>
        <div class="crop"><img src="./source-official-whiteboard.webp" alt="Official Heptabase Card panel" /></div>
      </figure>
      <figure>
        <figcaption>Implementation focus · canonical Card editor and locations</figcaption>
        <div class="crop"><img src="./implementation-desktop-final.png" alt="Prototype Card editor and Whiteboard locations" /></div>
      </figure>
    </main>
  </body>
</html>
