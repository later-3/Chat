<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heptabase source / implementation comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #171717; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 100vh; padding: 12px; }
      figure { display: flex; min-width: 0; flex-direction: column; gap: 8px; margin: 0; }
      figcaption { font-size: 13px; font-weight: 600; }
      img { display: block; width: 100%; aspect-ratio: 16 / 10; border: 1px solid rgba(255,255,255,.16); background: white; object-fit: contain; object-position: top; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source truth · official current Whiteboard + Card detail</figcaption>
        <img src="./source-official-whiteboard.webp" alt="Official Heptabase Whiteboard and Card detail" />
      </figure>
      <figure>
        <figcaption>Implementation · Card identity + placements + context panel</figcaption>
        <img src="./implementation-desktop-final.png" alt="Heptabase reference prototype desktop implementation" />
      </figure>
    </main>
  </body>
</html>
