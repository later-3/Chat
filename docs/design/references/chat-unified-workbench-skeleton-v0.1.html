  padding: 24px;
  text-align: center;

.panes { border: 1px solid var(--separator); border-radius: var(--radius-panel); overflow: hidden; margin-bottom: 12px; background: var(--surface-raised); }

.diff { border: 1px solid var(--separator); border-radius: var(--radius-panel); overflow: hidden; font-size: var(--font-aux); background: var(--surface-raised); }
.diff-line { display: flex; align-items: stretch; border-bottom: 1px solid var(--separator); min-height: 44px; }

.diff-line.add .diff-text { background: var(--bg-secondary); border-left: 3px solid var(--status-success); }

  .board { flex-direction: column; }
  .board-col { width: 100%; }
  .cal-grid { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }

/* ---------- 路由：canonical route = 表面 + 作用域 + 对象 + 副表面 ---------- */
var scrollMap = {};
var focusMap = {};

function parseHash() {
  var h = location.hash.slice(1) || "/chat";
  var parts = h.split(";");
  var seg = parts[0].split("/").filter(Boolean);
  var s = { surface: seg[0] || "chat", id: seg[1] || null, sub: seg[2] || null, panel: null };
  if (parts[1]) {
    var m = parts[1].match(/^panel=(\w+):(.+)$/);
    if (m) s.panel = { kind: m[1], ref: m[2] };
  }
  return s;
}
function buildHash(s) {
  var h = "/" + s.surface + (s.id ? "/" + s.id : "") + (s.sub ? "/" + s.sub : "");
  if (s.panel) h += ";panel=" + s.panel.kind + ":" + s.panel.ref;
  return h;
}
var state = parseHash();

function saveSpot() {
  var h = buildHash(state);
  scrollMap[h] = document.getElementById("center").scrollTop;
  var a = document.activeElement;
  if (a && a.getAttribute && a.getAttribute("data-fid")) focusMap[h] = a.getAttribute("data-fid");
}
function navigate(s, replace) {
  saveSpot();
  state = s;
  var h = "#" + buildHash(s);
  if (replace) history.replaceState(null, "", h); else history.pushState(null, "", h);
  render();
}
function go(patch) {
  var s = { surface: state.surface, id: state.id, sub: state.sub, panel: state.panel };
  for (var k in patch) s[k] = patch[k];
  navigate(s);
}
window.addEventListener("popstate", function () { state = parseHash(); render(); });

/* ---------- 工具 ---------- */
function esc(x) { return String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function project(id) { return model.projects.filter(function (p) { return p.id === id; })[0]; }
function work(id) { return model.works.filter(function (w) { return w.id === id; })[0]; }
function agent(id) { return model.agents.filter(function (a) { return a.id === id; })[0]; }
function stag(code, label) {
  return '<button type="button" class="stag" data-action="legend" data-scen="' + code + '" aria-label="查看场景 ' + code + ' 说明">' + code + (label ? " " + esc(label) : "") + '</button>';
}
function statusChip(text, level) {
  return '<span class="chip"><span class="dot ' + level + '" aria-hidden="true"></span>' + esc(text) + '</span>';
}
function runStatusChip(st) {
  if (st === "running") return statusChip("运行中", "ok");
  if (st === "waiting") return statusChip("等待人工决定", "warn");
  if (st === "outcome_unknown") return statusChip("结果未知", "bad");
  if (st === "succeeded") return statusChip("已成功", "ok");
  return statusChip(st, "idle");
}
function needsCount() { return model.feed.filter(function (f) { return f.status === "needs"; }).length; }

/* ---------- 作用域推导 ---------- */
function scopeLabel() {
  switch (state.surface) {
    case "chat": {
      var sess = model.sessions.filter(function (x) { return x.id === (state.id || "s1"); })[0];
      if (sess && sess.projectId) return '作用域：<b>项目</b> ' + esc(project(sess.projectId).name) + ' · 会话 ' + esc(sess.title);
      return '作用域：<b>全局</b> · 会话 ' + esc(sess ? sess.title : "默认");
    }
    case "project": {
      var p = project(state.id);
      return '作用域：<b>项目</b> ' + esc(p ? p.name : state.id);
    }
    case "work": {
      var w = work(state.id);
      return '作用域：<b>Work</b> ' + esc(w ? w.title : state.id) + ' · 所属项目 ' + esc(project(w.projectId).name);
    }
    case "decision": {
      var d = model.decisions[state.id];
      return '作用域：<b>决定</b> ' + esc(state.id) + ' · 项目 ' + esc(project(d.projectId).name);
    }
    case "run": return '作用域：<b>Run</b> ' + esc(state.id) + ' · 来自会话 s1';
    case "review": return '作用域：<b>Artifact</b> ' + esc(state.id) + ' · Run r1 · Work w1';
    case "reconcile": return '作用域：<b>对账</b> ' + esc(state.id) + ' · 结果未知处置';
    default: return '作用域：<b>全局</b>';
  }
}

    '<div class="list-item"><span class="grow"><span class="t">MCP 服务器</span><br><span class="s">2 个已登记 · 状态与工具清单可见</span></span>' + statusChip("已连接", "ok") + "</div></div></div>" +
    '<div class="card"><h2>记忆</h2><div class="list">' +
    '<div class="list-item"><span class="grow"><span class="t">工作区记忆</span><br><span class="s">3 条 · 仅本项目可见</span></span></div>' +
    '<div class="list-item"><span class="grow"><span class="t">全局记忆</span><br><span class="s">1 条 · 跨项目；候选需接受门后才成为长期事实</span></span></div></div></div>' +
    '<div class="card"><h2>工作流</h2><p class="muted">工作流定义、配置与触发属于后续设计。当前阶段只保留入口站位，不提供画布或编辑器。</p>' +
    '<button type="button" class="btn" disabled aria-disabled="true">工作流设计器（后续设计）</button></div>';
}

/* ---------- 副表面（统一槽位，一次一个） ---------- */
function renderPanel() {
  var el = document.getElementById("panel");
  if (!state.panel) { el.hidden = true; el.innerHTML = ""; return; }
  var p = state.panel;
  var body = "";
  var title = "";
  if (p.kind === "peek") {
    var w = work(p.ref);
    title = "快速预览 · Peek";
    body = '<p class="idline">Work · ' + esc(w.id) + " · " + esc(project(w.projectId).name) + "</p>" +
      "<h3>" + esc(w.title) + "</h3><p>" + esc(w.desc) + "</p><p>" + statusChip(w.status, w.status === "进行中" ? "warn" : "idle") + "</p>" +
      '<p class="aux">Peek 不复制事实；深入时再打开完整详情。</p>' +
      '<button type="button" class="btn primary" data-action="open-work" data-id="' + w.id + '">打开详情</button>';
  } else if (p.kind === "context") {
    title = "上下文与来源";
    body = '<p class="aux">Heptabase 式显式上下文：本次采用与访问痕迹一目了然。</p>' +
      '<div class="card"><h3>采用的上下文</h3><div class="row">' +
      '<span class="chip">卡片 c2 · Token 值表</span><span class="chip">卡片 c3 · Stage 1 决议</span></div></div>' +
      '<div class="card"><h3>访问日志</h3><div class="list">' +
      '<div class="list-item"><span class="grow"><span class="t">c2</span></span>' + statusChip("viewed", "ok") + "</div>" +
      '<div class="list-item"><span class="grow"><span class="t">c1</span></span>' + statusChip("searched", "idle") + "</div></div>" +
      '<p class="aux">回答先是候选；保存后带来源。引用对象：' + esc(p.ref) + "</p></div>";
  } else if (p.kind === "sidecar") {
    var r = model.runs[p.ref];
    title = "运行边车 · " + r.id;
    body = '<p class="aux">Open Computer 式边车：现场居中时，对话 / 子任务 / 日志 / 产物退到这里。</p>' +
      '<div class="card"><h3>子任务</h3><ul>' + r.steps.map(function (s) { return "<li>" + esc(s.t) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="card"><h3>产物</h3><button type="button" class="btn" data-action="open-review" data-id="art1">chat-skeleton-v0.1.html</button></div>' +
      '<div class="card"><h3>边车对话</h3><p class="aux">追问不会离开现场；边车不拥有权威事实。</p></div>';
  } else if (p.kind === "ask") {
    title = "就当前对象发问";
    body = '<p class="aux">消息归属对象所在线程，不是第二套对话。对象：' + esc(p.ref) + "</p>" +
      '<div id="ask-log">' + ui.askLog.map(function (m) { return '<div class="msg user"><div class="bubble">' + esc(m) + "</div></div>"; }).join("") + "</div>" +
      '<form class="composer" data-action-form="ask"><input type="text" name="msg" aria-label="就当前对象发问" placeholder="输入问题（骨架：仅本地追加）" autocomplete="off"><button type="submit" class="btn primary">发送</button></form>';
  }
  el.innerHTML = '<div class="panel-head"><span class="panel-title">' + title + '</span>' +
    '<button type="button" class="btn small" data-action="close-panel" data-fid="panel-close">关闭</button></div>' + body;
  el.hidden = false;
  var close = el.querySelector("[data-action='close-panel']");
  if (close) close.focus();
}

/* ---------- 场景图例抽屉 ---------- */
function renderLegend() {
  var el = document.getElementById("legend");
  if (el.hidden) return;
  el.innerHTML = '<div class="panel-head"><span class="panel-title">场景图例 · S1–S11</span>' +
    '<button type="button" class="btn small" data-action="close-legend" data-fid="legend-close">关闭</button></div>' +
    '<p class="aux">每组标注 = 场景名称 + 所取参考机制 + 当前是站位还是骨架交互。关闭“场景标注”后界面回到干净状态。</p>' +
    SCENES.map(function (s) {
      return '<div class="legend-item' + (ui.legendHl === s.c ? " hl" : "") + '" id="legend-' + s.c + '"><span class="code">' + s.c + "</span><b>" + esc(s.n) + "</b>" +
        '<p class="aux" style="margin:4px 0">机制：' + esc(s.m) + '</p><p class="st">状态：' + esc(s.s) + "</p></div>";
    }).join("");
  if (ui.legendHl) { var t = document.getElementById("legend-" + ui.legendHl); if (t) t.scrollIntoView({ block: "nearest" }); }
}

/* ---------- 总渲染 ---------- */
function render() {
  renderRail();
  renderTopbar();
  renderCenter();
  renderPanel();
  renderLegend();
  document.getElementById("more-menu").hidden = !ui.moreOpen;
  document.getElementById("scrim").hidden = document.getElementById("legend").hidden && !ui.moreOpen;
}

/* ---------- 事件 ---------- */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-action]");
  if (!t) return;
  var a = t.getAttribute("data-action");
  var id = t.getAttribute("data-id");
  var v = t.getAttribute("data-v");
  switch (a) {
    case "nav": ui.moreOpen = false; navigate({ surface: v || t.getAttribute("data-nav"), id: null, sub: null, panel: null }); break;
    case "more":
      ui.moreOpen = !ui.moreOpen;
      var mm = document.getElementById("more-menu");
      mm.innerHTML = [["calendar", "日历"], ["knowledge", "知识"], ["settings", "设置"]].map(function (x) {
        return '<button type="button" role="menuitem" data-action="nav" data-nav="' + x[0] + '">' + x[1] + "</button>";
      }).join("");
      render(); break;
    case "back": history.back(); break;
    case "toggle-annot": ui.annot = !ui.annot; render(); break;
    case "toggle-theme": {
      var dark = (document.documentElement.getAttribute("data-theme") === "dark") ||
        (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = dark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("chat-theme", next); } catch (err) { /* 忽略偏好写入失败 */ }
      render(); break;
    }
    case "open-legend": ui.legendHl = null; document.getElementById("legend").hidden = false; renderLegend(); document.getElementById("scrim").hidden = false; { var lc = document.querySelector("[data-fid='legend-close']"); if (lc) lc.focus(); } break;
    case "close-legend": document.getElementById("legend").hidden = true; document.getElementById("scrim").hidden = true; document.getElementById("annot-btn").focus(); break;
    case "legend": ui.legendHl = t.getAttribute("data-scen"); document.getElementById("legend").hidden = false; renderLegend(); document.getElementById("scrim").hidden = false; break;
    case "open-project": navigate({ surface: "project", id: id, sub: "overview", panel: null }); break;
    case "ptab": go({ sub: v, panel: null }); break;
    case "layout": ui.workLayout = v; render(); break;
    case "peek": go({ panel: { kind: "peek", ref: id } }); break;
    case "open-work": navigate({ surface: "work", id: id, sub: null, panel: null }); break;
    case "open-session": navigate({ surface: "chat", id: id, sub: null, panel: null }); break;
    case "today-filter": ui.todayFilter = v; render(); break;
    case "feed-tab": ui.feedTab = v; render(); break;
    case "open-decision": navigate({ surface: "decision", id: id, sub: null, panel: null }); break;
    case "open-reconcile": ui.reconcile = null; navigate({ surface: "reconcile", id: id, sub: null, panel: null }); break;
    case "open-run": navigate({ surface: "run", id: id, sub: null, panel: { kind: "sidecar", ref: id } }); break;
    case "open-review": navigate({ surface: "review", id: id, sub: null, panel: null }); break;
    case "panel": go({ panel: { kind: t.getAttribute("data-kind"), ref: t.getAttribute("data-ref") } }); break;
    case "close-panel": go({ panel: null }); break;
    case "clarify": ui.clarifyDone = true; render(); break;
    case "edit-plan": ui.planEdit = true; render(); break;
    case "edit-cancel": ui.planEdit = false; render(); break;
    case "decide": {
      var d = model.decisions[state.id];
      d.status = v;
      var f = model.feed.filter(function (x) { return x.ref === d.id; })[0];
      if (f) f.status = "done";
      if (d.id === "d1" && v === "approved") {
        model.runs.r1.status = "running";
        model.runs.r1.steps[2].s = "done";
        model.runs.r1.steps[3].s = "active";
      }
      render(); break;
    }
    case "reconcile": {
      ui.reconcile = v === "query" ? "confirmed" : "escalated";
      if (v === "query") { var f2 = model.feed.filter(function (x) { return x.ref === state.id; })[0]; if (f2) f2.status = "done"; }
      render(); break;
    }
    case "run-pane": ui.runPane = v; render(); break;
    case "annotate": ui.annotating = Number(t.getAttribute("data-line")); render(); break;
    case "handback": ui.handedBack = true; render(); break;
    case "cal": ui.calScale = v; render(); break;
    case "know": ui.knowTab = v; render(); break;
    case "noop": break;
  }
});

/* 点击遮罩：关闭图例 / 更多菜单 */
document.getElementById("scrim").addEventListener("click", function () {
  document.getElementById("legend").hidden = true;
  ui.moreOpen = false;
  render();
});

/* 表单提交 */
document.addEventListener("submit", function (e) {
  var f = e.target.closest("[data-action-form]");
  if (!f) return;
  e.preventDefault();
  var kind = f.getAttribute("data-action-form");
  if (kind === "save-plan") {
    var d = model.decisions[state.id];
    d.steps = d.steps.map(function (s, i) { return (f.elements["step" + i].value || s).trim() || s; });
    d.revision += 1;
    ui.planEdit = false;
    render();
  } else if (kind === "save-ann") {
    var line = Number(f.getAttribute("data-line"));
    var text = f.elements.ann.value.trim();
    if (text) ui.annotations.push({ line: line, text: text });
    ui.annotating = null;
    render();
  } else if (kind === "ask") {
    var m = f.elements.msg.value.trim();
    if (m) ui.askLog.push(m);
    render();
  } else if (kind === "send") {
    f.elements.msg.value = "";
  }
});

/* Escape：关闭临时层并把焦点还给触发点 */
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (!document.getElementById("legend").hidden) {
    document.getElementById("legend").hidden = true;
    document.getElementById("scrim").hidden = true;
    document.getElementById("annot-btn").focus();
  } else if (ui.moreOpen) {
    ui.moreOpen = false; render();
  } else if (state.panel) {
    go({ panel: null });
  }
});

/* ---------- 启动：默认进入对话 ---------- */
if (!location.hash) history.replaceState(null, "", "#/chat");
state = parseHash();
render();
</script>
</body>
</html>
