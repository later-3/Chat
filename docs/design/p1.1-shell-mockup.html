<!doctype html>
<!--
  P1.1 界面草图（静态评审用，非产品代码）。
  URL 参数：theme=light|dark, device=desktop|mobile, tab=chat|workflow,
            state=empty|queued|running|succeeded|failed|all, demo=1
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P1.1 界面草图</title>
    <style>
      /* ===== 设计Token：与 docs/product/design-guidelines.md v1 一致 ===== */
      :root,
      [data-theme="light"] {
        --bg-primary: #ffffff;
        --bg-secondary: #f5f5f4;
        --bg-tertiary: #ebebe9;
        --surface-raised: #ffffff;
        --text-primary: #1d1d1f;
        --text-secondary: #6e6e73;
        --text-tertiary: #9b9ba0;
        --separator: rgba(29, 29, 31, 0.1);
        --accent: #1d1d1f;
        --accent-text: #ffffff;
        --status-success: #248a3d;
        --status-warning: #a85b00;
        --status-danger: #c22f3d;
        color-scheme: light;
      }
      [data-theme="dark"] {
        --bg-primary: #000000;
        --bg-secondary: #161617;
        --bg-tertiary: #242426;
        --surface-raised: #2c2c2e;
        --text-primary: #f5f5f7;
        --text-secondary: #98989f;
        --text-tertiary: #6c6c72;
        --separator: rgba(245, 245, 247, 0.14);
        --accent: #ffffff;
        --accent-text: #000000;
        --status-success: #30d158;
        --status-warning: #ff9f0a;
        --status-danger: #ff453a;
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue",
          "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.45;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }

      /* ===== 顶栏 ===== */
      .topbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--separator);
        background: var(--bg-primary);
      }
      .brand {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .top-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .conn {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .conn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--status-success);
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        font-size: 18px;
        color: var(--text-primary);
      }
      .icon-btn:hover {
        background: var(--bg-secondary);
      }

      /* ===== 桌面双栏 ===== */
      .columns {
        display: grid;
        grid-template-columns: 1fr 360px;
        height: calc(100% - 56px);
      }
      .chat {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .msg {
        max-width: 640px;
      }
      .msg .role {
        font-size: 13px;
        color: var(--text-tertiary);
        margin-bottom: 4px;
      }
      .msg.user {
        align-self: flex-end;
      }
      .msg.user .bubble {
        background: var(--bg-secondary);
        border-radius: 18px;
        padding: 10px 16px;
      }
      .msg.assistant .bubble {
        padding: 10px 0;
      }
      .chat-empty {
        flex: 1;
        display: grid;
        place-items: center;
        color: var(--text-tertiary);
        font-size: 15px;
        text-align: center;
      }
      .composer {
        padding: 12px 32px 20px;
      }
      .composer-inner {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-secondary);
        border-radius: 18px;
        padding: 8px 8px 8px 16px;
      }
      .composer input {
        flex: 1;
        border: none;
        background: none;
        outline: none;
        font: inherit;
        color: var(--text-primary);
        min-height: 32px;
      }
      .composer input::placeholder {
        color: var(--text-tertiary);
      }
      .send {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 17px;
        display: grid;
        place-items: center;
        flex: none;
      }

      /* ===== 工作流面板 ===== */
      .workflow {
        border-left: 1px solid var(--separator);
        padding: 20px 16px;
        overflow-y: auto;
        background: var(--bg-primary);
      }
      .wf-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 12px;
      }
      .run-card {
        background: var(--bg-secondary);
        border-radius: 14px;
        padding: 16px;
      }
      .run-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      .run-title {
        font-size: 15px;
        font-weight: 600;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--bg-tertiary);
        color: var(--text-primary);
        white-space: nowrap;
      }
      .badge.queued {
        color: var(--status-warning);
      }
      .badge.succeeded {
        color: var(--status-success);
      }
      .badge.failed {
        color: var(--status-danger);
      }
      .steps {
        list-style: none;
        display: flex;
        flex-direction: column;
      }
      .steps li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--separator);
        font-size: 15px;
      }
      .steps li:first-child {
        border-top: none;
      }
      .s-ico {
        width: 20px;
        text-align: center;
        flex: none;
        font-size: 13px;
      }
      .steps li.done .s-ico {
        color: var(--status-success);
      }
      .steps li.current .s-ico {
        color: var(--text-primary);
      }
      .steps li.pending {
        color: var(--text-tertiary);
      }
      .steps li.failed .s-ico {
        color: var(--status-danger);
      }
      .steps li.failed {
        color: var(--text-primary);
      }
      .s-name {
        flex: 1;
      }
      .s-st {
        font-size: 13px;
        color: var(--text-tertiary);
      }
      .steps li.current .s-st {
        color: var(--text-primary);
        font-weight: 600;
      }
      .steps li.failed .s-st {
        color: var(--status-danger);
      }
      .run-note {
        margin-top: 12px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .run-note.failed {
        color: var(--status-danger);
      }
      .run-hint {
        margin-top: 4px;
        font-size: 13px;
        color: var(--text-tertiary);
      }

      .wf-empty {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 15px;
        padding: 24px;
      }
      .wf-empty .glyph {
        font-size: 28px;
        display: block;
        margin-bottom: 12px;
        color: var(--text-tertiary);
      }

      /* ===== 手机布局 ===== */
      body.device-mobile .columns {
        display: block;
        height: calc(100% - 56px - 60px);
      }
      body.device-mobile .workflow {
        border-left: none;
      }
      .tabs {
        display: none;
        padding: 8px 16px;
        border-bottom: 1px solid var(--separator);
      }
      body.device-mobile .tabs {
        display: block;
      }
      .tabs-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--bg-secondary);
        border-radius: 10px;
        padding: 2px;
        height: 36px;
      }
      .tabs button {
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        margin: -6px 0; /* 触控目标≥44px，视觉保持36px高 */
      }
      .tabs button[aria-selected="true"] {
        background: var(--surface-raised);
        color: var(--text-primary);
      }
      .tabs .pill {
        min-width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 12px;
        font-weight: 600;
        display: inline-grid;
        place-items: center;
        padding: 0 5px;
      }
      body.device-mobile .chat,
      body.device-mobile .workflow {
        height: 100%;
      }
      body.device-mobile[data-tab="chat"] .workflow {
        display: none;
      }
      body.device-mobile[data-tab="workflow"] .chat {
        display: none;
      }
      body.device-mobile .composer {
        padding: 12px 16px 16px;
      }
      body.device-mobile .messages {
        padding: 16px;
      }

      /* ===== 五态总览 ===== */
      .state-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
        padding: 24px;
      }
      .state-grid h3 {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .state-grid .workflow {
        border: 1px solid var(--separator);
        border-radius: 14px;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Chat</div>
      <div class="top-right">
        <span class="conn"><span class="dot"></span>已连接</span>
        <button class="icon-btn" aria-label="切换主题" id="theme-btn"></button>
      </div>
    </header>
    <nav class="tabs" aria-label="视图切换">
      <div class="tabs-inner">
        <button role="tab" id="tab-chat" aria-selected="true">对话</button>
        <button role="tab" id="tab-wf" aria-selected="false">
          工作流 <span class="pill" id="wf-pill" hidden>1</span>
        </button>
      </div>
    </nav>
    <main class="columns" id="main"></main>

    <template id="tpl-chat">
      <section class="chat" aria-label="对话区">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <div class="composer-inner">
            <input type="text" placeholder="发消息…" aria-label="消息输入框" />
            <button class="send" aria-label="发送" disabled style="opacity: 0.4">↑</button>
          </div>
        </div>
      </section>
    </template>

    <script>
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme") || "light";
      const device = params.get("device") || "desktop";
      const tab = params.get("tab") || "chat";
      const state = params.get("state") || "running";
      const demo = params.get("demo") === "1";

      document.documentElement.dataset.theme = theme;
      document.body.classList.add(`device-${device}`);
      document.body.dataset.tab = tab;
      document.getElementById("theme-btn").innerHTML =
        theme === "light"
          ? '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M13.5 11.5A5.5 5.5 0 0 1 6.5 4.5a5.5 5.5 0 1 0 7 7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M14.3 3.7l-1.4 1.4M5.1 12.9l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

      if (device === "mobile") {
        document.getElementById("tab-chat").setAttribute("aria-selected", String(tab === "chat"));
        document.getElementById("tab-wf").setAttribute("aria-selected", String(tab === "workflow"));
        if (state === "running") document.getElementById("wf-pill").hidden = false;
      }

      const main = document.getElementById("main");

      /* ===== 对话区 ===== */
      function renderChat() {
        const node = document.getElementById("tpl-chat").content.cloneNode(true);
        const messages = node.getElementById("messages");
        if (demo) {
          messages.innerHTML = `
            <div class="msg user"><div class="bubble">帮我整理一下这个季度 OKR 的进展，输出一份简短总结。</div></div>
            <div class="msg assistant"><div class="role">Assistant</div><div class="bubble">好的，我先梳理已有的目标与关键结果，再生成总结。完成后会在这里给出正式结果。</div></div>
            <div class="msg user"><div class="bubble">重点看 KR 的完成度，不用展开细节。</div></div>`;
        } else {
          messages.outerHTML = `<div class="chat-empty"><div>开始一段对话<br /><span style="font-size:13px">输入消息，Chat 会持续跟进这件事</span></div></div>`;
        }
        return node;
      }

      /* ===== 工作流面板 ===== */
      const STEP_DEFS = ["接收消息", "后台处理", "生成回复", "保存结果"];
      const STATE_META = {
        queued: { badge: ["queued", "◌", "等待中"], note: "已接收，等待开始。" },
        running: { badge: ["running", "◐", "进行中"], note: "当前步骤：生成回复。" },
        succeeded: { badge: ["succeeded", "✓", "已完成"], note: "结果摘要：已生成回复并保存。" },
        failed: {
          badge: ["failed", "✕", "失败"],
          note: "生成回复失败：服务暂不可用。",
          hint: "恢复与重试动作将在后续版本提供。",
        },
      };

      function stepState(state, idx) {
        if (state === "queued") return "pending";
        if (state === "running") return idx < 2 ? "done" : idx === 2 ? "current" : "pending";
        if (state === "succeeded") return "done";
        if (state === "failed") return idx < 2 ? "done" : idx === 2 ? "failed" : "pending";
        return "pending";
      }
      const STEP_ICON = { done: "✓", current: "◐", pending: "○", failed: "✕" };
      const STEP_LABEL = { done: "完成", current: "进行中", pending: "未开始", failed: "失败" };

      function renderWorkflow(state) {
        const aside = document.createElement("aside");
        aside.className = "workflow";
        aside.setAttribute("aria-label", "工作流运行状态");
        if (state === "empty") {
          aside.innerHTML = `
            <h2 class="wf-title">当前工作流</h2>
            <div class="wf-empty"><div><span class="glyph">◇</span>还没有进行中的工作<br /><span style="font-size:13px">发送消息后，这里会显示工作进度</span></div></div>`;
          return aside;
        }
        const meta = STATE_META[state];
        const steps = STEP_DEFS.map((name, i) => {
          const st = stepState(state, i);
          return `<li class="${st}"><span class="s-ico">${STEP_ICON[st]}</span><span class="s-name">${name}</span><span class="s-st">${STEP_LABEL[st]}</span></li>`;
        }).join("");
        aside.innerHTML = `
          <h2 class="wf-title">当前工作流</h2>
          <div class="run-card">
            <div class="run-head">
              <span class="run-title">回复用户消息</span>
              <span class="badge ${meta.badge[0]}">${meta.badge[1]} ${meta.badge[2]}</span>
            </div>
            <ol class="steps">${steps}</ol>
            <p class="run-note ${state === "failed" ? "failed" : ""}">${meta.note}</p>
            ${meta.hint ? `<p class="run-hint">${meta.hint}</p>` : ""}
          </div>`;
        return aside;
      }

      if (state === "all") {
        document.querySelector(".topbar").style.display = "none";
        document.querySelector(".tabs").style.display = "none";
        main.className = "state-grid";
        main.style.height = "auto";
        for (const s of ["empty", "queued", "running", "succeeded", "failed"]) {
          const wrap = document.createElement("div");
          const h = document.createElement("h3");
          h.textContent = {
            empty: "empty 空态",
            queued: "queued 等待",
            running: "running 进行中",
            succeeded: "succeeded 已完成",
            failed: "failed 失败",
          }[s];
          wrap.appendChild(h);
          wrap.appendChild(renderWorkflow(s));
          main.appendChild(wrap);
        }
      } else {
        main.appendChild(renderChat());
        main.appendChild(renderWorkflow(state));
      }
    </script>
  </body>
</html>
