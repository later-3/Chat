<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1480">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 11px; }
    .region-label { font-size: 11px; font-weight: 700; }
    .name { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .desc { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
    .tiny { fill: #cbd5e1; font-size: 9px; }
    .arrow-label { font-size: 10px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1500" height="1480" fill="#0f172a"/>
  <rect width="1500" height="1480" fill="url(#grid)"/>

  <text x="36" y="42" class="title">单 Workflow 任务规划与执行闭环</text>
  <text x="36" y="65" class="subtitle">一个 Product Run 对应一个 PlanningExecutionWorkflow Run；交付顺序：先调通后端 API / Workflow / pi，再接入前端</text>

  <rect x="250" y="178" width="1000" height="1140" rx="18" fill="rgba(120,53,15,0.08)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="9,5"/>
  <text x="270" y="205" fill="#fbbf24" class="region-label">交付步骤 1 · 后端闭环 · 同一个 WORKFLOW RUN · 规划 / 暂停 / 循环 / 执行 / 提交</text>

  <rect x="24" y="432" width="202" height="808" rx="14" fill="rgba(76,29,149,0.12)" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="42" y="458" fill="#a78bfa" class="region-label">CHAT PRODUCT</text>

  <rect x="1270" y="432" width="206" height="312" rx="14" fill="rgba(8,51,68,0.12)" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="1288" y="458" fill="#22d3ee" class="region-label">交付步骤 2 · 用户 / WEB</text>

  <!-- Connections: drawn before nodes -->
  <line x1="750" y1="150" x2="750" y2="232" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="750" y1="292" x2="750" y2="342" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="750" y1="422" x2="750" y2="472" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="750" y1="552" x2="750" y2="602" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="750" y1="682" x2="750" y2="724" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="750" y1="804" x2="750" y2="872" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="770" y="842" fill="#34d399" class="arrow-label">通过</text>
  <line x1="750" y1="952" x2="750" y2="1002" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="750" y1="1082" x2="750" y2="1132" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="750" y1="1212" x2="750" y2="1262" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Product fact projection and decision path -->
  <path d="M 560 512 H 226" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="304" y="500" fill="#a78bfa" class="arrow-label">提交 Plan Revision + Approval</text>
  <path d="M 226 520 H 1270" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1070" y="507" fill="#22d3ee" class="arrow-label">Query 展示计划</text>
  <path d="M 1270 660 H 226" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1040" y="647" fill="#22d3ee" class="arrow-label">Decision Command</text>
  <path d="M 226 692 H 560 V 642" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-amber)"/>
  <text x="320" y="680" fill="#fbbf24" class="arrow-label">先提交决定，再由后端恢复私有 Hook</text>
  <path d="M 560 1172 H 208" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="322" y="1158" fill="#a78bfa" class="arrow-label">Product Commit</text>

  <!-- Revision loop and rejection branch -->
  <path d="M 830 764 H 1050 V 382 H 940" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1070" y="610" fill="#fbbf24" class="arrow-label">修改：新 revision</text>
  <path d="M 670 764 H 402 V 834" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="460" y="748" fill="#fb7185" class="arrow-label">拒绝</text>

  <!-- Opaque masks + visual nodes -->
  <rect x="540" y="82" width="420" height="68" rx="28" fill="#0f172a"/>
  <rect x="540" y="82" width="420" height="68" rx="28" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="750" y="110" class="name">Chat 保存用户输入与 Product Run</text>
  <text x="750" y="132" class="desc">Application事务提交后，才启动Workflow</text>

  <rect x="560" y="232" width="380" height="60" rx="24" fill="#0f172a"/>
  <rect x="560" y="232" width="380" height="60" rx="24" fill="rgba(59,130,246,0.30)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="750" y="258" class="name">PlanningExecutionWorkflow 开始</text>
  <text x="750" y="279" class="desc">唯一Workflow Run · 输入只含产品引用与版本</text>

  <rect x="560" y="342" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="560" y="342" width="380" height="80" rx="8" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.8"/>
  <text x="750" y="371" class="name">pi.plan · 规划节点</text>
  <text x="750" y="394" class="desc">只生成结构化 Plan Candidate</text>
  <text x="750" y="411" class="desc">无外部副作用能力</text>

  <rect x="560" y="472" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="560" y="472" width="380" height="80" rx="8" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="750" y="501" class="name">publish_plan_review · Application Step</text>
  <text x="750" y="524" class="desc">提交 Plan Revision / Hash / Approval Request</text>
  <text x="750" y="541" class="desc">模型候选到此才成为可审核产品事实</text>

  <rect x="560" y="602" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="560" y="602" width="380" height="80" rx="8" fill="rgba(120,53,15,0.34)" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="750" y="631" class="name">await_plan_decision · Hook暂停</text>
  <text x="750" y="654" class="desc">同一个Workflow挂起，不占用持续计算</text>
  <text x="750" y="671" class="desc">Hook Token仅后端可见</text>

  <g transform="translate(750,764)">
    <polygon points="0,-40 80,0 0,40 -80,0" fill="#0f172a"/>
    <polygon points="0,-40 80,0 0,40 -80,0" fill="rgba(120,53,15,0.34)" stroke="#fbbf24" stroke-width="1.8"/>
    <text y="-3" class="name">已提交决定</text>
    <text y="17" class="desc">修改 / 通过 / 拒绝</text>
  </g>

  <rect x="560" y="872" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="560" y="872" width="380" height="80" rx="8" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.8"/>
  <text x="750" y="901" class="name">pi.execute · 执行复合节点</text>
  <text x="750" y="924" class="desc">只执行 Approved Plan Hash绑定的步骤</text>
  <text x="750" y="941" class="desc">逐Plan Step调用pi，不能自行扩权或改计划</text>

  <rect x="560" y="1002" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="560" y="1002" width="380" height="80" rx="8" fill="rgba(30,41,59,0.65)" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="750" y="1031" class="name">validate_execution · 确定性验证</text>
  <text x="750" y="1054" class="desc">Schema + Success Criteria + Evidence</text>
  <text x="750" y="1071" class="desc">不接受模型“已完成”作为事实</text>

  <rect x="560" y="1132" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="560" y="1132" width="380" height="80" rx="8" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="750" y="1161" class="name">product_commit · Application Step</text>
  <text x="750" y="1184" class="desc">幂等提交正式Message / Artifact / Run终态</text>
  <text x="750" y="1201" class="desc">Workflow与pi都不能直接宣布产品成功</text>

  <rect x="590" y="1262" width="320" height="58" rx="24" fill="#0f172a"/>
  <rect x="590" y="1262" width="320" height="58" rx="24" fill="rgba(59,130,246,0.30)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="750" y="1288" class="name">同一个Workflow Run结束</text>
  <text x="750" y="1307" class="desc">返回运行诊断，不替代Product Store事实</text>

  <!-- Product and user side nodes -->
  <rect x="42" y="480" width="166" height="100" rx="8" fill="#0f172a"/>
  <rect x="42" y="480" width="166" height="100" rx="8" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="125" y="510" class="name">Product Store</text>
  <text x="125" y="534" class="desc">Plan / Approval</text>
  <text x="125" y="552" class="desc">Decision / Result</text>
  <text x="125" y="570" class="desc">权威产品事实</text>

  <rect x="42" y="622" width="166" height="96" rx="8" fill="#0f172a"/>
  <rect x="42" y="622" width="166" height="96" rx="8" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="125" y="651" class="name">Decision提交门</text>
  <text x="125" y="675" class="desc">Principal / revision</text>
  <text x="125" y="693" class="desc">Hash / commandId</text>
  <text x="125" y="711" class="desc">提交后写Outbox</text>

  <rect x="42" y="1090" width="166" height="110" rx="8" fill="#0f172a"/>
  <rect x="42" y="1090" width="166" height="110" rx="8" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="125" y="1120" class="name">正式结果</text>
  <text x="125" y="1144" class="desc">Message / Artifact</text>
  <text x="125" y="1162" class="desc">Product Run终态</text>
  <text x="125" y="1180" class="desc">只有产品提交才成功</text>

  <rect x="1288" y="480" width="170" height="100" rx="8" fill="#0f172a"/>
  <rect x="1288" y="480" width="170" height="100" rx="8" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="1373" y="510" class="name">查看计划</text>
  <text x="1373" y="534" class="desc">目标 / 步骤 / 风险</text>
  <text x="1373" y="552" class="desc">成功标准 / 输入输出</text>
  <text x="1373" y="570" class="desc">不显示Runtime私有ID</text>

  <rect x="1288" y="622" width="170" height="96" rx="8" fill="#0f172a"/>
  <rect x="1288" y="622" width="170" height="96" rx="8" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="1373" y="651" class="name">用户决定</text>
  <text x="1373" y="677" class="desc">修改 · 通过 · 拒绝</text>
  <text x="1373" y="698" class="desc">只提交Chat Command</text>

  <rect x="294" y="834" width="216" height="76" rx="24" fill="#0f172a"/>
  <rect x="294" y="834" width="216" height="76" rx="24" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.7"/>
  <text x="402" y="865" class="name">Product Run取消</text>
  <text x="402" y="888" class="desc">不执行pi.execute</text>

  <rect x="964" y="350" width="190" height="64" rx="8" fill="#0f172a"/>
  <rect x="964" y="350" width="190" height="64" rx="8" fill="rgba(120,53,15,0.34)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="1059" y="377" class="name">Revision Input</text>
  <text x="1059" y="399" class="desc">旧Plan引用 + 用户修改</text>

  <!-- Legend -->
  <rect x="36" y="1370" width="1428" height="76" rx="12" fill="rgba(30,41,59,0.72)" stroke="#334155" stroke-width="1"/>
  <circle cx="68" cy="1397" r="6" fill="#34d399"/><text x="84" y="1401" class="tiny">pi Agent Step</text>
  <circle cx="224" cy="1397" r="6" fill="#a78bfa"/><text x="240" y="1401" class="tiny">Chat产品事实 / Application Step</text>
  <circle cx="476" cy="1397" r="6" fill="#fbbf24"/><text x="492" y="1401" class="tiny">Workflow Hook / 控制流</text>
  <circle cx="698" cy="1397" r="6" fill="#22d3ee"/><text x="714" y="1401" class="tiny">用户可见交互</text>
  <circle cx="874" cy="1397" r="6" fill="#fb7185"/><text x="890" y="1401" class="tiny">拒绝 / 取消</text>
  <text x="68" y="1427" class="tiny">实线：Workflow内部控制流　虚线：通过Chat产品边界的Query / Command / Commit；浏览器永远不持有Hook Token</text>
</svg>
