name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod

  dsh-smoke:
    # 唯一前端完成门：真实准备固定DSH profile，启动Host并确认LifeOS插件路由已挂载。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chat/dsh-lifeos-bridge build
      - run: pnpm --filter @chat/dsh-web prepare:profile
      - name: dsh host and bridge start
        run: |
          pnpm --filter @chat/dsh-web start > /tmp/chat-dsh-web.log 2>&1 &
          dsh_pid=$!
          trap 'kill "$dsh_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            sleep 1
            if curl -fsS http://127.0.0.1:43110/ | grep -q "DeepSeek Harness"; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/chat-dsh-web.log; exit 1; fi
          done
          curl -fsS http://127.0.0.1:43110/lifeos/sessions/ci-probe | grep -q '"schemaVersion":"chat-dsh-lifeos-bridge.v1"'

  dev-smoke:
    # 完成门：干净检出、不预建全仓dist时，API与DSH Web均可启动。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: api dev starts without build
        run: |
          (cd apps/api && PORT=3210 pnpm dev &)
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS localhost:3210/api/healthz; then exit 0; fi
          done
          exit 1

      - name: dsh web dev starts from managed profile
        run: |
          CHAT_API_BASE_URL=http://127.0.0.1:3210 pnpm --filter @chat/dsh-web dev > /tmp/chat-dsh-dev.log 2>&1 &
          dsh_pid=$!
          trap 'kill "$dsh_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            sleep 1
            if curl -fsS localhost:43110/ | grep -q "DeepSeek Harness"; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/chat-dsh-dev.log; exit 1; fi
          done
          curl -fsS localhost:43110/lifeos/sessions/dev-smoke | grep -q '"run":null'
