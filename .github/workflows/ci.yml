name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 普通CI永远不继承本机或仓库中的Provider、外部写和付费开关。
env:
  CI: "true"
  ANTHROPIC_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  CHAT_ALLOW_EXTERNAL_WRITES: "0"
  CHAT_ALLOW_PAID_TESTS: "0"
  CHAT_ALLOW_UNKNOWN_EXTERNAL_SERVICES: "0"
  CHAT_CODE_WORKBENCH_ENABLED: "0"
  CHAT_DEBUG_PI_KEY_READER: ""
  CHAT_DEBUG_PI_PROVIDER_CONFIG: ""
  CHAT_EXTERNAL_TEST_COMMAND_NAME: ""
  CHAT_MEMMY_TOKEN: ""
  CHAT_MEMORY_ENABLED: "0"
  CHAT_MEMORY_REAL_TEST: "0"
  CHAT_PAID_TEST_COMMAND_NAME: ""
  CHAT_PLANE_CE_API_TOKEN: ""
  CHAT_PLANE_CE_REAL_TEST: "0"
  CHAT_PROJECT_MODEL_API_KEY_ENV: ""
  CHAT_PROJECT_MODEL_BASE_URL: ""
  CHAT_TENCENT_MEMORYCORE_TOKEN: ""
  DASHSCOPE_API_KEY: ""
  DASHSCOPE_BASE_URL: ""
  DEEPSEEK_API_KEY: ""
  DEEPSEEK_BASE_URL: ""
  GEMINI_API_KEY: ""
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  GOOGLE_API_KEY: ""
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""
  PLANE_API_TOKEN: ""

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # 公开安装入口：取得并构建固定Pi/DSH源码、冻结安装Chat、准备核心运行工件。
      - name: Bootstrap pinned Chat runtime
        run: pnpm bootstrap

      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Deterministic tests
        run: pnpm test

      # 只运行一条跨越DSH、Bridge、Chat、Workflow和真实Pi AgentSession的代表性纵向。
      # Fork自己的全量测试仍只在各自仓库运行。
      - run: pnpm --filter @chat/dsh-web exec playwright install --with-deps chromium
      - name: System browser seam
        run: pnpm test:browser:capability-governance

      - name: Installed system starts, becomes healthy, and stops cleanly
        run: |
          node scripts/dev/start.mjs --workbench=off > /tmp/chat-ci-system.log 2>&1 &
          chat_pid=$!
          cleanup() {
            kill -INT "$chat_pid" 2>/dev/null || true
            wait "$chat_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 180); do
            sleep 1
            if ! kill -0 "$chat_pid" 2>/dev/null; then cat /tmp/chat-ci-system.log; exit 1; fi
            chat_root_body=$(curl --noproxy '*' -fsS http://127.0.0.1:43110/ 2>/dev/null || true)
            chat_lifeos_body=$(curl --noproxy '*' -fsS http://127.0.0.1:43110/lifeos/sessions/ci-system 2>/dev/null || true)
            if [[ "$chat_root_body" == *"DeepSeek Harness"* ]] && \
              [[ "$chat_lifeos_body" == *'"run":null'* ]] && \
              curl --noproxy '*' -fsS -o /dev/null http://127.0.0.1:43111/api/readyz && \
              curl --noproxy '*' -fsS -o /dev/null http://127.0.0.1:43112/healthz; then
              break
            fi
            if [ "$i" = "180" ]; then cat /tmp/chat-ci-system.log; exit 1; fi
          done
          if curl -fsS --max-time 1 http://127.0.0.1:18960/api/v1/health; then exit 1; fi
          if curl -fsS --max-time 1 http://127.0.0.1:18970/health; then exit 1; fi
          pnpm dev:status | tee /tmp/chat-ci-running.log
          if grep -Eq 'healthy workbench|healthy (memory|memoryCore)' /tmp/chat-ci-running.log; then exit 1; fi
          kill -INT "$chat_pid"
          wait "$chat_pid"
          trap - EXIT
          pnpm dev:status | tee /tmp/chat-ci-stopped.log
          grep -q '本地开发环境未运行' /tmp/chat-ci-stopped.log
