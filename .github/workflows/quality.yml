name: Product quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Restore locked Python environment
        run: UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen --dev
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore locked frontend environment
        working-directory: frontend
        run: npm ci
      - name: Install browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run complete product verification
        run: ./scripts/verify.sh
      - name: Audit dependencies and licenses
        run: ./scripts/verify-supply-chain.sh
