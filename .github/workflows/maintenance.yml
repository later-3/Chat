name: maintenance

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ANTHROPIC_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  CHAT_ALLOW_EXTERNAL_WRITES: "0"
  CHAT_ALLOW_PAID_TESTS: "0"
  CHAT_ALLOW_UNKNOWN_EXTERNAL_SERVICES: "0"
  CHAT_CODE_WORKBENCH_ENABLED: "0"
  CHAT_DEBUG_PI_KEY_READER: ""
  CHAT_DEBUG_PI_PROVIDER_CONFIG: ""
  CHAT_EXTERNAL_TEST_COMMAND_NAME: ""
  CHAT_MEMMY_TOKEN: ""
  CHAT_MEMORY_ENABLED: "0"
  CHAT_MEMORY_REAL_TEST: "0"
  CHAT_PAID_TEST_COMMAND_NAME: ""
  CHAT_PROJECT_MODEL_API_KEY_ENV: ""
  CHAT_PROJECT_MODEL_BASE_URL: ""
  CHAT_TENCENT_MEMORYCORE_TOKEN: ""
  DASHSCOPE_API_KEY: ""
  DASHSCOPE_BASE_URL: ""
  DEEPSEEK_API_KEY: ""
  DEEPSEEK_BASE_URL: ""
  GEMINI_API_KEY: ""
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  GOOGLE_API_KEY: ""
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""

jobs:
  maintenance:
    name: maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Bootstrap pinned Chat runtime
        run: pnpm bootstrap
      - run: pnpm build
      - run: pnpm --filter @chat/dsh-web exec playwright install --with-deps chromium
      - name: Full deterministic browser regression
        run: pnpm test:browser
      - name: Audit Chat production dependencies
        run: pnpm audit --prod
