  <rect x="825" y="575" width="220" height="110" rx="9" fill="#0f172a"/>
  <rect x="825" y="575" width="220" height="110" rx="9" fill="rgba(59,130,246,0.28)" stroke="#60a5fa" stroke-width="2.2"/>
  <rect x="1160" y="585" width="200" height="90" rx="9" fill="#0f172a"/>
  <rect x="1160" y="585" width="200" height="90" rx="9" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.7"/>
  <rect x="485" y="705" width="220" height="60" rx="8" fill="#0f172a"/>
  <rect x="485" y="705" width="220" height="60" rx="8" fill="rgba(30,41,59,0.72)" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="120" y="705" width="245" height="60" rx="8" fill="#0f172a"/>
  <rect x="120" y="705" width="245" height="60" rx="8" fill="rgba(30,41,59,0.72)" stroke="#94a3b8" stroke-width="1.3"/>

  <text x="240" y="611" class="name">Chat API + Durable Ingress</text>
  <text x="240" y="632" class="desc">Project、Chat Session、入口映射</text>
  <text x="240" y="650" class="desc">Revision、权限、幂等键</text>

  <text x="595" y="611" class="name">LongAgent Runtime</text>
  <text x="595" y="632" class="desc">冻结Agent Definition</text>
  <text x="595" y="650" class="desc">串行化同Session Turn</text>

  <text x="935" y="605" class="name">Pi AgentSession</text>
  <text x="935" y="629" class="desc">唯一Agent Loop</text>
  <text x="935" y="647" class="desc">Model · Thinking · Context</text>
  <text x="935" y="665" class="tiny">原生Session Entry / Usage / Compact</text>

  <text x="1260" y="611" class="name">Chat Tool Gateway</text>
  <text x="1260" y="632" class="desc">Workflow · Memory</text>
  <text x="1260" y="650" class="desc">Agent-to-Agent · Delivery</text>

  <text x="595" y="729" class="name">Resolved Resources</text>
  <text x="595" y="749" class="desc">Rule · Skill · Extension · Agent Memory</text>
  <text x="242" y="729" class="name">Project Context</text>
  <text x="242" y="749" class="desc">Daily或显式Project，禁止隐式跨Project</text>

  <!-- Storage boxes -->
  <rect x="135" y="895" width="210" height="65" rx="8" fill="#0f172a"/>
  <rect x="135" y="895" width="210" height="65" rx="8" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="490" y="895" width="210" height="65" rx="8" fill="#0f172a"/>
  <rect x="490" y="895" width="210" height="65" rx="8" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="830" y="895" width="210" height="65" rx="8" fill="#0f172a"/>
  <rect x="830" y="895" width="210" height="65" rx="8" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="1155" y="895" width="210" height="65" rx="8" fill="#0f172a"/>
  <rect x="1155" y="895" width="210" height="65" rx="8" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>

  <text x="240" y="920" class="name">Chat Project Store</text>
  <text x="240" y="941" class="desc">Project / LongAgent / Binding</text>
  <text x="595" y="920" class="name">Pi Session Store</text>
  <text x="595" y="941" class="desc">用户可见完整会话事实源</text>
  <text x="935" y="920" class="name">Long Agent Memory</text>
  <text x="935" y="941" class="desc">按longAgentId隔离的身份与经验</text>
  <text x="1260" y="920" class="name">Chat Mem0</text>
  <text x="1260" y="941" class="desc">Personal / Project事实与检索</text>

  <!-- Footer notes / legend -->
  <rect x="55" y="1010" width="1490" height="30" rx="7" fill="rgba(30,41,59,0.72)" stroke="#334155"/>
  <circle cx="82" cy="1025" r="5" fill="#22d3ee"/>
  <text x="95" y="1029" class="note">入口</text>
  <circle cx="157" cy="1025" r="5" fill="#fbbf24"/>
  <text x="170" y="1029" class="note">NanoClaw通道职责</text>
  <circle cx="315" cy="1025" r="5" fill="#34d399"/>
  <text x="328" y="1029" class="note">Chat服务</text>
  <circle cx="425" cy="1025" r="5" fill="#60a5fa"/>
  <text x="438" y="1029" class="note">唯一Pi Agent Runtime</text>
  <circle cx="615" cy="1025" r="5" fill="#a78bfa"/>
  <text x="628" y="1029" class="note">持久事实</text>
  <text x="1515" y="1029" class="note" text-anchor="end">原则：先绑定、再持久化、再执行；先提交Session、再投递</text>

  <!-- Title -->
  <text x="55" y="48" class="title">Chat × NanoClaw × Pi：统一 Long Agent 架构</text>
  <text x="55" y="72" class="subtitle">NanoClaw负责长期在线入口与可靠投递；Chat负责产品事实与资源；Pi SDK是唯一Agent Runtime</text>
</svg>
