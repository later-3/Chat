  <path d="M705 625 L825 625" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <path d="M1045 625 L1160 625" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <path d="M935 675 L935 895" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M1260 675 L1260 895" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M595 675 L595 895" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M1260 585 L1260 455 L1315 455" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M1315 325 L1315 195 L660 195" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M240 675 L240 895" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M705 735 L760 735 L825 675" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <path d="M485 735 L365 735" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- Arrow label masks -->
  <rect x="183" y="372" width="114" height="20" rx="5" fill="#0f172a"/>
  <text x="240" y="386" class="flow-label">Web直接执行</text>
  <rect x="590" y="486" width="190" height="20" rx="5" fill="#0f172a"/>
  <text x="685" y="500" class="flow-label">③ HTTP Event → Durable Ingress</text>
  <rect x="370" y="607" width="105" height="20" rx="5" fill="#0f172a"/>
  <text x="422" y="621" class="flow-label">④ 绑定与去重</text>
  <rect x="716" y="607" width="100" height="20" rx="5" fill="#0f172a"/>
  <text x="766" y="621" class="flow-label">⑤ 创建Turn</text>
  <rect x="1056" y="607" width="96" height="20" rx="5" fill="#0f172a"/>
  <text x="1104" y="621" class="flow-label">⑥ Tool调用</text>
  <rect x="1182" y="477" width="156" height="20" rx="5" fill="#0f172a"/>
  <text x="1260" y="491" class="flow-label">⑦ HTTP Delivery + Ack</text>
  <rect x="950" y="350" width="144" height="20" rx="5" fill="#0f172a"/>
  <text x="1022" y="364" class="flow-label">② 持久HTTP Outbox</text>

  <!-- Opaque masks + boxes: entry -->
  <rect x="145" y="145" width="190" height="50" rx="8" fill="#0f172a"/>
  <rect x="145" y="145" width="190" height="50" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.6"/>
  <rect x="475" y="145" width="190" height="50" rx="8" fill="#0f172a"/>
  <rect x="475" y="145" width="190" height="50" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.6"/>
  <rect x="805" y="145" width="190" height="50" rx="8" fill="#0f172a"/>
  <rect x="805" y="145" width="190" height="50" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.6"/>
  <rect x="1135" y="145" width="240" height="50" rx="8" fill="#0f172a"/>
  <rect x="1135" y="145" width="240" height="50" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.6"/>

  <text x="240" y="167" class="name">Chat Web</text>
  <text x="240" y="184" class="desc">Project下新建或继续Session</text>
  <text x="570" y="167" class="name">Telegram / IM</text>
  <text x="570" y="184" class="desc">Bot私聊、群聊、Thread</text>
  <text x="900" y="167" class="name">定时 / 主动事件</text>
  <text x="900" y="184" class="desc">Cron、Webhook、系统唤醒</text>
  <text x="1255" y="167" class="name">后续入口</text>
  <text x="1255" y="184" class="desc">Slack、Discord、Email、WeChat</text>

  <!-- NanoClaw boxes -->
  <rect x="350" y="325" width="230" height="90" rx="9" fill="#0f172a"/>
  <rect x="350" y="325" width="230" height="90" rx="9" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.6"/>
  <rect x="755" y="325" width="190" height="90" rx="9" fill="#0f172a"/>
  <rect x="755" y="325" width="190" height="90" rx="9" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.6"/>
  <rect x="1005" y="325" width="190" height="90" rx="9" fill="#0f172a"/>
  <rect x="1005" y="325" width="190" height="90" rx="9" fill="rgba(251,146,60,0.22)" stroke="#fb923c" stroke-width="1.8"/>
  <rect x="1260" y="325" width="220" height="130" rx="9" fill="#0f172a"/>
  <rect x="1260" y="325" width="220" height="130" rx="9" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.6"/>

  <text x="465" y="350" class="name">Channel + Router</text>
  <text x="465" y="370" class="desc">身份、权限、Agent Group</text>
  <text x="465" y="387" class="desc">Messaging Group、Thread</text>
  <text x="465" y="402" class="tiny">① 外部事件标准化</text>

  <text x="850" y="350" class="name">Durable Inbox</text>
  <text x="850" y="370" class="desc">持久化后再执行</text>
  <text x="850" y="387" class="desc">断线、重启、退避恢复</text>
  <text x="850" y="402" class="tiny">Mailbox不是对话事实源</text>

  <text x="1100" y="350" class="name">HTTP Event Client</text>
  <text x="1100" y="374" class="desc">主动提交到Chat Backend</text>
  <text x="1100" y="392" class="desc">不初始化Session Runtime / Docker</text>

  <text x="1370" y="350" class="name">Outbound Delivery</text>
  <text x="1370" y="371" class="desc">目标入口、文件、重试</text>
  <text x="1370" y="389" class="desc">投递回执、失败状态</text>
  <text x="1370" y="412" class="tiny">投递重试 ≠ 重跑Pi Turn</text>
  <text x="1370" y="430" class="tiny">Web回复不广播Telegram</text>

  <!-- Chat + Pi boxes -->
  <rect x="120" y="585" width="240" height="90" rx="9" fill="#0f172a"/>
  <rect x="120" y="585" width="240" height="90" rx="9" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.7"/>
  <rect x="485" y="585" width="220" height="90" rx="9" fill="#0f172a"/>
