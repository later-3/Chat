<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 11px; }
    .region-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .name { fill: #f8fafc; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .desc { fill: #cbd5e1; font-size: 9.5px; text-anchor: middle; }
    .tiny { fill: #94a3b8; font-size: 8.5px; text-anchor: middle; }
    .flow-label { fill: #e2e8f0; font-size: 9px; font-weight: 600; text-anchor: middle; }
    .note { fill: #cbd5e1; font-size: 9px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#0f172a"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <!-- Regions -->
  <rect x="55" y="105" width="1490" height="125" rx="14" fill="rgba(8,51,68,0.12)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="72" y="127" fill="#22d3ee" class="region-label">用户入口</text>

  <rect x="55" y="265" width="1490" height="225" rx="14" fill="rgba(120,53,15,0.10)" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="8,5"/>
  <text x="72" y="288" fill="#fbbf24" class="region-label">NanoClaw — Long Agent Channel Gateway（HTTP客户端、无 Agent Session Runtime、无 Docker）</text>

  <rect x="55" y="525" width="1490" height="285" rx="14" fill="rgba(6,78,59,0.10)" stroke="#34d399" stroke-width="1.2" stroke-dasharray="8,5"/>
  <text x="72" y="548" fill="#34d399" class="region-label">Chat + Pi — 唯一 Agent Runtime 与产品事实源</text>

  <rect x="55" y="845" width="1490" height="145" rx="14" fill="rgba(76,29,149,0.10)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="72" y="868" fill="#a78bfa" class="region-label">持久化与事实所有权</text>

